[project]
name = "semiconductor-affairs"
version = "0.1.0"
description = "LSTM lead-lag prediction of a small-cap semiconductor stock from hourly bars"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semiconductor_affairs"]

[tool.ruff]
line-length = 79

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]
